<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swarm Intelligence — AI Drone Command Center</title>
<meta name="description" content="Real-time AI-powered 3D drone swarm control via Gemini intelligence">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
:root {
  --bg: #050810;
  --bg2: #0c1020;
  --accent: #00e5ff;
  --accent2: #7c4dff;
  --green: #00e676;
  --red: #ff1744;
  --amber: #ffab00;
  --border: rgba(255,255,255,0.06);
  --text: #e8edf5;
  --muted: #6b7a8d;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:.8rem 1.5rem;background:rgba(5,8,16,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);z-index:100;flex-shrink:0}
.logo{display:flex;align-items:center;gap:10px}
.logo h1{font-family:'Space Grotesk',sans-serif;font-size:1.1rem;font-weight:700;background:linear-gradient(90deg,var(--text),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{transform:scale(.9);opacity:.6}50%{transform:scale(1.1);opacity:1}}
.status-badge{font-size:.75rem;font-weight:700;padding:4px 12px;border-radius:20px;border:1px solid;letter-spacing:.5px}
.connected{color:var(--green);border-color:var(--green);background:rgba(0,230,118,.08)}
.disconnected{color:var(--red);border-color:var(--red);background:rgba(255,23,68,.08)}
.main{display:grid;grid-template-columns:1fr 360px;flex:1;overflow:hidden;gap:0}
#canvas-wrap{position:relative;overflow:hidden;background:#020408}
#c{display:block;width:100%;height:100%}
.overlay-tl{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:10}
.overlay-br{position:absolute;bottom:12px;left:12px;font-size:.7rem;color:var(--accent);background:rgba(5,8,16,.8);padding:6px 10px;border-radius:6px;border:1px solid var(--border);font-family:monospace;pointer-events:none;z-index:10}
.badge{font-size:.7rem;font-weight:700;padding:4px 10px;border-radius:20px;border:1px solid;letter-spacing:.5px;font-family:'Space Grotesk',sans-serif}
.badge-action{color:var(--accent);border-color:var(--accent);background:rgba(0,229,255,.1)}
.badge-form{color:var(--accent2);border-color:var(--accent2);background:rgba(124,77,255,.1)}
.sidebar{background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.panel{padding:1rem;border-bottom:1px solid var(--border)}
.panel-title{font-family:'Space Grotesk',sans-serif;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:.8rem}
.fleet-list{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto}
.drone-card{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:8px;padding:8px 10px;transition:border-color .3s}
.drone-card.leader{border-color:var(--accent);box-shadow:0 0 12px rgba(0,229,255,.1)}
.dc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.dc-id{font-family:'Space Grotesk',sans-serif;font-size:.8rem;font-weight:700}
.dc-role{font-size:.65rem;font-weight:800;padding:2px 6px;border-radius:3px;text-transform:uppercase;letter-spacing:.5px}
.role-leader{background:rgba(0,229,255,.15);color:var(--accent);border:1px solid var(--accent)}
.role-follower{background:rgba(255,255,255,.05);color:var(--muted)}
.dc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.dc-stat{background:rgba(0,0,0,.2);border-radius:4px;padding:4px;text-align:center}
.dc-stat-label{font-size:.6rem;color:var(--muted);text-transform:uppercase}
.dc-stat-val{font-size:.75rem;font-weight:700;font-family:'Space Grotesk',sans-serif;margin-top:1px}
.bar-bg{height:3px;background:rgba(255,255,255,.06);border-radius:2px;margin-top:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:2px;transition:width .4s ease}
.bar-hi{background:var(--green)} .bar-md{background:var(--amber)} .bar-lo{background:var(--red)}
.terminal{background:#04060d;border-radius:8px;padding:.7rem;font-family:monospace;font-size:.72rem;height:130px;overflow-y:auto;border:1px solid rgba(255,255,255,.03);color:var(--muted);flex-shrink:0}
.tl{margin-bottom:3px;line-height:1.4}
.tl.sys{color:var(--muted)} .tl.ok{color:var(--green)} .tl.cmd{color:var(--accent)} .tl.ai{color:var(--accent2)} .tl.warn{color:var(--amber)}
.json-out{background:#04060d;border-radius:8px;padding:.7rem;font-family:monospace;font-size:.7rem;max-height:110px;overflow-y:auto;border:1px solid rgba(124,77,255,.2);color:var(--accent2);white-space:pre-wrap;word-break:break-all}
.cmd-area{padding:1rem;border-top:1px solid var(--border);margin-top:auto}
.cmd-label{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.5rem}
.cmd-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.cmd-input{flex:1 1 100%;background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:6px;padding:8px 10px;color:var(--text);font-family:'Outfit',sans-serif;font-size:.82rem;outline:none;transition:border-color .25s}
.cmd-input:focus{border-color:var(--accent);box-shadow:0 0 8px rgba(0,229,255,.12)}
.cmd-input::placeholder{color:var(--muted)}
.btn{background:transparent;border-radius:6px;padding:8px 12px;cursor:pointer;font-family:'Outfit',sans-serif;font-size:.82rem;font-weight:600;border:1px solid;transition:all .25s;white-space:nowrap}
.btn-send{border-color:var(--accent);color:var(--accent)}
.btn-send:hover{background:var(--accent);color:#050810;box-shadow:0 0 12px rgba(0,229,255,.3)}
.btn-voice{border-color:var(--red);color:var(--red)}
.btn-voice:hover{background:rgba(255,23,68,.15);box-shadow:0 0 12px rgba(255,23,68,.2)}
.btn-voice.recording{background:rgba(255,23,68,.2);box-shadow:0 0 16px rgba(255,23,68,.4);animation:rec-blink 1s infinite alternate}
@keyframes rec-blink{from{opacity:.7}to{opacity:1}}
.ai-label{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.4rem;margin-top:.6rem}
.live-intent{font-family:'Space Grotesk',sans-serif;font-size:.9rem;font-weight:700;color:var(--accent);margin-bottom:.6rem;min-height:1.2em}
::-webkit-scrollbar{width:4px} ::-webkit-scrollbar-track{background:transparent} ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
</style>
</head>
<body>
<header>
  <div class="logo">
    <div class="pulse"></div>
    <h1>SWARM INTELLIGENCE — AI DRONE COMMAND</h1>
  </div>
  <div id="hud-status" class="status-badge disconnected">OFFLINE</div>
</header>
<div class="main">
  <div id="canvas-wrap">
    <canvas id="c"></canvas>
    <div class="overlay-tl">
      <span id="badge-action" class="badge badge-action">HOLD</span>
      <span id="badge-form" class="badge badge-form">IDLE HOVER</span>
    </div>
    <div class="overlay-br">🖱 Drag: Rotate &nbsp;|&nbsp; Scroll: Zoom &nbsp;|&nbsp; Right-click: Pan</div>
  </div>
  <div class="sidebar">
    <div class="panel">
      <div class="panel-title">Fleet Telemetry</div>
      <div class="fleet-list" id="fleet-list"></div>
    </div>
    <div class="panel" style="flex:1;overflow:hidden;display:flex;flex-direction:column">
      <div class="panel-title">Activity Log</div>
      <div class="terminal" id="terminal"></div>
      <div class="ai-label">Gemini Live Response</div>
      <div class="live-intent" id="live-intent">"Hold Position"</div>
      <div class="json-out" id="json-out">{ "action": "HOLD" }</div>
    </div>
    <div class="cmd-area">
      <div class="cmd-label">Transmit AI Command</div>
      <div class="cmd-row">
        <input id="cmd-input" class="cmd-input" type="text" placeholder='e.g. "form a spiral and rise"' autocomplete="off">
        <button id="btn-send" class="btn btn-send">Send</button>
        <button id="btn-voice" class="btn btn-voice" title="Use Voice Command">🎙 Voice</button>
      </div>
    </div>
  </div>
</div>
<script>
// ─── THREE.JS SETUP ───────────────────────────────────────────────────────────
const wrap = document.getElementById('canvas-wrap');
const canvas = document.getElementById('c');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020408);
scene.fog = new THREE.FogExp2(0x020408, 0.008);

const camera = new THREE.PerspectiveCamera(55, wrap.clientWidth / wrap.clientHeight, 0.1, 5000);
camera.position.set(0, 12, 22);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(wrap.clientWidth, wrap.clientHeight);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 3;
controls.maxDistance = 200;

// Lighting
scene.add(new THREE.AmbientLight(0x223355, 0.8));
const sun = new THREE.DirectionalLight(0x00e5ff, 0.6);
sun.position.set(10, 20, 10);
scene.add(sun);
const fill = new THREE.PointLight(0x7c4dff, 1.2, 80);
fill.position.set(-10, 8, -10);
scene.add(fill);

// Ground grid (large)
const grid = new THREE.GridHelper(400, 80, 0x00e5ff, 0x0d1525);
grid.position.y = 0;
scene.add(grid);

// Secondary faint grid
const grid2 = new THREE.GridHelper(400, 20, 0x7c4dff, 0x070d18);
grid2.position.y = 0.01;
scene.add(grid2);

// ─── STARFIELD ───────────────────────────────────────────────────────────────
(function buildStars() {
  const count = 4000;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count * 3; i++) {
    pos[i] = (Math.random() - 0.5) * 2000;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({ color: 0xaabbdd, size: 0.6, sizeAttenuation: true, transparent: true, opacity: 0.7 });
  scene.add(new THREE.Points(geo, mat));
})();

// ─── DRONE FACTORY ───────────────────────────────────────────────────────────
const DRONE_COLORS = [
  0x00e5ff, 0x7c4dff, 0x00e676, 0xff6d00, 0xff1744, 0xffab00, 0xe040fb, 0x40c4ff,
  0xf50057, 0x69f0ae, 0xeeff41, 0xff6e40, 0x18ffff, 0xb388ff, 0xccff90, 0xff80ab
];
const droneObjects = {}; // id → { group, rotors[], bubble, altLine, crown, target:{x,y,z} }

function makeDrone(id, colorHex) {
  const group = new THREE.Group();

  // Body octahedron
  const bodyGeo = new THREE.OctahedronGeometry(0.18, 0);
  const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, emissive: colorHex, emissiveIntensity: 0.4, metalness: 0.6, roughness: 0.3 });
  group.add(new THREE.Mesh(bodyGeo, bodyMat));

  // Arms + rotors
  const rotors = [];
  const armMat = new THREE.MeshStandardMaterial({ color: 0x1a2030, metalness: 0.8, roughness: 0.4 });
  const rotorMat = new THREE.MeshStandardMaterial({ color: colorHex, transparent: true, opacity: 0.55, metalness: 0.5, roughness: 0.2 });
  const armDirs = [[1,0],[0,1],[-1,0],[0,-1]];
  armDirs.forEach(([dx,dz]) => {
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.5, 6), armMat);
    arm.rotation.z = Math.PI / 2;
    arm.position.set(dx * 0.25, 0, dz * 0.25);
    arm.rotation.y = Math.atan2(dz, dx);
    group.add(arm);
    const rotor = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.018, 12), rotorMat);
    rotor.position.set(dx * 0.5, 0.05, dz * 0.5);
    group.add(rotor);
    rotors.push(rotor);
  });

  // Safety bubble
  const bubbleGeo = new THREE.SphereGeometry(0.7, 10, 10);
  const bubbleMat = new THREE.MeshBasicMaterial({ color: colorHex, wireframe: true, transparent: true, opacity: 0.08 });
  const bubble = new THREE.Mesh(bubbleGeo, bubbleMat);
  group.add(bubble);

  // Altitude trail line
  const lineMat = new THREE.LineBasicMaterial({ color: colorHex, transparent: true, opacity: 0.3 });
  const lineGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,0)]);
  const altLine = new THREE.Line(lineGeo, lineMat);
  scene.add(altLine);

  // Crown (leader indicator)
  const crown = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.22, 4), new THREE.MeshBasicMaterial({ color: 0xffdd00 }));
  crown.position.y = 0.32;
  crown.visible = false;
  group.add(crown);

  // Point light per drone (subtle)
  const light = new THREE.PointLight(colorHex, 0.5, 4);
  group.add(light);

  scene.add(group);
  droneObjects[id] = { group, rotors, bubble, altLine, crown, target: { x: 0, y: 1.5, z: 0 }, color: colorHex };
}

// ─── PRACTICE FIELD OBJECTS ──────────────────────────────────────────────────
// Deterministic pseudo-random helper (seeded)
function seededRand(seed) {
  let s = seed;
  return function() {
    s = (s * 9301 + 49297) % 233280;
    return s / 233280;
  };
}

function buildFieldObjects() {
  const rng = seededRand(0xC0DE);

  // ── Pine Trees (close enough to be visible from default camera) ─────────────
  const treePositions = [
    [-7, -6], [6, -7], [-5,  7], [7,  5], [-8, 1],
    [ 5, -4], [-3, -7], [8, -2], [-6, 6], [3,  8]
  ];
  treePositions.forEach(([tx, tz]) => {
    const trunkH = 1.4 + rng() * 0.8;
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(0.18, 0.28, trunkH, 8),
      new THREE.MeshStandardMaterial({ color: 0x5c3a1e, roughness: 0.9, metalness: 0.0 })
    );
    trunk.position.set(tx, trunkH / 2, tz);
    scene.add(trunk);
    // Three-tier canopy
    [2.0, 1.4, 0.8].forEach((coneR, k) => {
      const coneH = coneR * 1.6;
      const cone = new THREE.Mesh(
        new THREE.ConeGeometry(coneR, coneH, 8),
        new THREE.MeshStandardMaterial({ color: 0x2e7d32, emissive: 0x0a3010, emissiveIntensity: 0.2, roughness: 0.8 })
      );
      cone.position.set(tx, trunkH + k * (coneH * 0.52) + coneH / 2, tz);
      scene.add(cone);
    });
  });

  // ── Metal Lattice Towers ─────────────────────────────────────────────────────
  const towerSpots = [[-6, 5], [7, -3], [1, -8], [-5, -5]];
  towerSpots.forEach(([tx, tz]) => {
    const h = 5.5 + rng() * 2.0;
    const towerMat = new THREE.MeshStandardMaterial({ color: 0xb0bec5, metalness: 0.85, roughness: 0.25 });
    [[-0.3,-0.3],[0.3,-0.3],[-0.3,0.3],[0.3,0.3]].forEach(([ox, oz]) => {
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.10, h, 6), towerMat);
      leg.position.set(tx + ox, h / 2, tz + oz);
      scene.add(leg);
    });
    [h * 0.25, h * 0.55, h * 0.82].forEach(bh => {
      const brace = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.05, 0.05), towerMat);
      brace.position.set(tx, bh, tz);
      scene.add(brace);
      const brace2 = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.05, 0.7), towerMat);
      brace2.position.set(tx, bh, tz);
      scene.add(brace2);
    });
    // Red beacon on top
    const beacon = new THREE.Mesh(
      new THREE.SphereGeometry(0.14, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0xff1744 })
    );
    beacon.position.set(tx, h + 0.18, tz);
    scene.add(beacon);
    const ptLight = new THREE.PointLight(0xff1744, 1.2, 8);
    ptLight.position.set(tx, h + 0.18, tz);
    scene.add(ptLight);
  });

  // ── Barrel Clusters ──────────────────────────────────────────────────────────
  const barrelSpots = [[-4, 4], [5, -5], [-2, 6], [6, 6]];
  const barrelColors = [0xff6d00, 0xffeb3b, 0xb71c1c, 0x1565c0];
  barrelSpots.forEach(([bx, bz], gi) => {
    for (let b = 0; b < 3; b++) {
      const ox = (rng() - 0.5) * 1.2;
      const oz = (rng() - 0.5) * 1.2;
      const barrel = new THREE.Mesh(
        new THREE.CylinderGeometry(0.28, 0.28, 0.75, 12),
        new THREE.MeshStandardMaterial({ color: barrelColors[gi % barrelColors.length], metalness: 0.6, roughness: 0.4 })
      );
      barrel.position.set(bx + ox, 0.375, bz + oz);
      scene.add(barrel);
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(0.29, 0.035, 6, 12),
        new THREE.MeshStandardMaterial({ color: 0x37474f, metalness: 0.9 })
      );
      ring.position.set(bx + ox, 0.52, bz + oz);
      ring.rotation.x = Math.PI / 2;
      scene.add(ring);
    }
  });

  // ── Gate Hoops (fly-through rings) — CENTRE of the field ────────────────────
  const gateSpots = [
    { x:  0,  z: -4,  r: 1.8, rot: 0 },
    { x:  5,  z:  4,  r: 1.5, rot: Math.PI / 4 },
    { x: -6,  z:  1,  r: 2.0, rot: Math.PI / 6 },
    { x:  3,  z: -7,  r: 1.6, rot: -Math.PI / 5 },
    { x: -3,  z: -6,  r: 1.4, rot: Math.PI / 3 }
  ];
  const gateColors = [0x00e5ff, 0x7c4dff, 0x00e676, 0xff6d00, 0xff1744];
  gateSpots.forEach((g, i) => {
    const gateMat = new THREE.MeshStandardMaterial({
      color: gateColors[i], emissive: gateColors[i],
      emissiveIntensity: 0.6, metalness: 0.7, roughness: 0.2
    });
    const hoop = new THREE.Mesh(new THREE.TorusGeometry(g.r, 0.09, 12, 40), gateMat);
    hoop.position.set(g.x, g.r + 0.1, g.z);
    hoop.rotation.y = g.rot;
    scene.add(hoop);
    // Translucent centre disc for aiming
    const discMat = new THREE.MeshBasicMaterial({
      color: gateColors[i], transparent: true, opacity: 0.10, side: THREE.DoubleSide
    });
    const disc = new THREE.Mesh(new THREE.CircleGeometry(g.r * 0.92, 32), discMat);
    disc.position.set(g.x, g.r + 0.1, g.z);
    disc.rotation.y = g.rot;
    scene.add(disc);
    // Support posts (left + right)
    [-1, 1].forEach(side => {
      const post = new THREE.Mesh(
        new THREE.CylinderGeometry(0.05, 0.05, g.r + 0.1, 6),
        new THREE.MeshStandardMaterial({ color: 0x546e7a, metalness: 0.6 })
      );
      post.position.set(
        g.x + Math.cos(g.rot + Math.PI/2) * side * g.r,
        (g.r + 0.1) / 2,
        g.z + Math.sin(g.rot + Math.PI/2) * side * g.r
      );
      scene.add(post);
    });
  });

  // ── Concrete Walls ───────────────────────────────────────────────────────────
  const wallDefs = [
    { x: -3,  z:  3,  w: 4.5, h: 2.0, rot: 0 },
    { x:  6,  z: -2,  w: 3.5, h: 1.6, rot: Math.PI / 3 },
    { x: -7,  z: -4,  w: 5.0, h: 2.5, rot: Math.PI / 6 },
    { x:  2,  z:  7,  w: 4.0, h: 1.8, rot: -Math.PI / 4 }
  ];
  const wallMat = new THREE.MeshStandardMaterial({ color: 0x607d8b, roughness: 0.95, metalness: 0.05 });
  wallDefs.forEach(wd => {
    const wall = new THREE.Mesh(new THREE.BoxGeometry(wd.w, wd.h, 0.3), wallMat);
    wall.position.set(wd.x, wd.h / 2, wd.z);
    wall.rotation.y = wd.rot;
    scene.add(wall);
    // Stripe detail
    const stripe = new THREE.Mesh(new THREE.BoxGeometry(wd.w, 0.12, 0.32),
      new THREE.MeshStandardMaterial({ color: 0xffab00, roughness: 0.9 }));
    stripe.position.set(wd.x, wd.h * 0.6, wd.z);
    stripe.rotation.y = wd.rot;
    scene.add(stripe);
  });

  // ── Landing Pad Markers ──────────────────────────────────────────────────────
  const padDefs = [[0, 0], [-5, 2], [4, 5]];
  padDefs.forEach(([px, pz], i) => {
    const padColor = [0x00e5ff, 0x00e676, 0xffab00][i];
    const pad = new THREE.Mesh(
      new THREE.CylinderGeometry(1.1, 1.1, 0.05, 32),
      new THREE.MeshStandardMaterial({ color: padColor, emissive: padColor, emissiveIntensity: 0.35, metalness: 0.4, roughness: 0.5 })
    );
    pad.position.set(px, 0.025, pz);
    scene.add(pad);
    // H marker (horizontal bar + two verticals)
    const hMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    [[0.75, 0.01, 0.14], [0.14, 0.01, 0.75]].forEach((dims, d) => {
      const bar = new THREE.Mesh(new THREE.BoxGeometry(...dims), hMat);
      bar.position.set(px, 0.05, pz);
      scene.add(bar);
    });
    const vb1 = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.01, 0.75), hMat);
    vb1.position.set(px - 0.3, 0.05, pz);
    scene.add(vb1);
    const vb2 = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.01, 0.75), hMat);
    vb2.position.set(px + 0.3, 0.05, pz);
    scene.add(vb2);
    // Outer ring of small marker lights
    for (let m = 0; m < 8; m++) {
      const ang = (m / 8) * Math.PI * 2;
      const ml = new THREE.Mesh(
        new THREE.SphereGeometry(0.06, 6, 6),
        new THREE.MeshBasicMaterial({ color: padColor })
      );
      ml.position.set(px + Math.cos(ang) * 1.0, 0.06, pz + Math.sin(ang) * 1.0);
      scene.add(ml);
    }
  });
}

buildFieldObjects();

// ─── DRONE CARD UI ───────────────────────────────────────────────────────────
const fleetList = document.getElementById('fleet-list');
const droneCards = {};

function ensureDroneCard(id, colorHex) {
  if (droneCards[id]) return;
  const hex = '#' + colorHex.toString(16).padStart(6, '0');
  const card = document.createElement('div');
  card.className = 'drone-card';
  card.id = 'card-' + id;
  card.innerHTML = `
    <div class="dc-top">
      <span class="dc-id" style="color:${hex}">${id}</span>
      <span class="dc-role role-follower" id="role-${id}">Follower</span>
    </div>
    <div class="dc-stats">
      <div class="dc-stat"><div class="dc-stat-label">X,Y</div><div class="dc-stat-val" id="pos-${id}">0,0</div></div>
      <div class="dc-stat"><div class="dc-stat-label">Alt</div><div class="dc-stat-val" id="alt-${id}">0m</div></div>
      <div class="dc-stat"><div class="dc-stat-label">Bat</div><div class="dc-stat-val" id="bat-${id}">100%</div></div>
    </div>
    <div class="bar-bg"><div class="bar-fill bar-hi" id="bar-${id}" style="width:100%"></div></div>`;
  fleetList.appendChild(card);
  droneCards[id] = card;
}

// ─── ANIMATION LOOP ───────────────────────────────────────────────────────────
let frame = 0;
function animate() {
  requestAnimationFrame(animate);
  frame++;
  Object.keys(droneObjects).forEach(id => {
    const d = droneObjects[id];
    const g = d.group;
    // Lerp towards target
    g.position.x += (d.target.x - g.position.x) * 0.06;
    g.position.y += (d.target.y - g.position.y) * 0.06;
    g.position.z += (d.target.z - g.position.z) * 0.06;
    // Rotor spin
    d.rotors.forEach((r, i) => { r.rotation.y += 0.18 * (i % 2 === 0 ? 1 : -1); });
    // Bubble rotate
    d.bubble.rotation.y += 0.008;
    d.bubble.rotation.x += 0.004;
    // Crown spin
    if (d.crown.visible) d.crown.rotation.y += 0.04;
    // Hover oscillation
    g.position.y += Math.sin(frame * 0.04 + d._phase) * 0.003;
    // Altitude line
    const wp = g.getWorldPosition(new THREE.Vector3());
    const pts = [wp, new THREE.Vector3(wp.x, 0, wp.z)];
    d.altLine.geometry.setFromPoints(pts);
    d.altLine.geometry.attributes.position.needsUpdate = true;
  });
  controls.update();
  renderer.render(scene, camera);
}
animate();

// ─── RESIZE ──────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = wrap.clientWidth / wrap.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(wrap.clientWidth, wrap.clientHeight);
});

// ─── TERMINAL ─────────────────────────────────────────────────────────────────
const terminal = document.getElementById('terminal');
function log(msg, cls = 'sys') {
  const d = document.createElement('div');
  d.className = 'tl ' + cls;
  d.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
  terminal.appendChild(d);
  terminal.scrollTop = terminal.scrollHeight;
}

// ─── WEBSOCKET ────────────────────────────────────────────────────────────────
const hudStatus = document.getElementById('hud-status');
const badgeAction = document.getElementById('badge-action');
const badgeForm = document.getElementById('badge-form');
const liveIntent = document.getElementById('live-intent');
const jsonOut = document.getElementById('json-out');

let socket;
function wsURL() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  return proto + '//' + location.host + '/ws/client' + location.search;
}
function connect() {
  socket = new WebSocket(wsURL());
  socket.onopen = () => {
    hudStatus.textContent = 'AI ONLINE';
    hudStatus.className = 'status-badge connected';
    log('🟢 WebSocket connected — Gemini AI ready', 'ok');
  };
  socket.onmessage = ev => {
    const data = JSON.parse(ev.data);
    if (data.type === 'intent_update') {
      badgeAction.textContent = data.action;
      badgeForm.textContent = formLabel(data.action);
      liveIntent.textContent = `"${data.raw}"`;
      jsonOut.textContent = JSON.stringify({ action: data.action, target: data.target, radius: data.radius, altitude: data.altitude, speed: data.speed, count: data.count }, null, 2);
      log(`🤖 Gemini → ${data.action} | r=${data.radius}m alt=${data.altitude}m`, 'ai');
      return;
    }
    // Drone telemetry
    const id = data.drone_id;
    const colorIdx = Object.keys(droneObjects).length;
    if (!droneObjects[id]) {
      const c = DRONE_COLORS[colorIdx % DRONE_COLORS.length];
      makeDrone(id, c);
      Object.assign(droneObjects[id], { _phase: Math.random() * Math.PI * 2 });
      ensureDroneCard(id, c);
      log(`🚁 Drone ${id} joined the swarm`, 'ok');
    }
    if (!droneObjects[id]._phase) droneObjects[id]._phase = Math.random() * Math.PI * 2;
    // Update target (Three.js axes: Go X→X, Go Y→Z, Go Z(alt)→Y)
    const tx = data.x - 3;
    const ty = data.z;
    const tz = data.y - 3;
    droneObjects[id].target = { x: tx, y: ty, z: tz };
    droneObjects[id].crown.visible = data.role === 'leader';
    // UI card
    const card = droneCards[id];
    if (card) {
      document.getElementById('pos-' + id).textContent = `${data.x.toFixed(1)},${data.y.toFixed(1)}`;
      document.getElementById('alt-' + id).textContent = `${data.z.toFixed(1)}m`;
      document.getElementById('bat-' + id).textContent = `${data.battery}%`;
      const bar = document.getElementById('bar-' + id);
      bar.style.width = data.battery + '%';
      bar.className = 'bar-fill ' + (data.battery > 50 ? 'bar-hi' : data.battery > 25 ? 'bar-md' : 'bar-lo');
      const roleEl = document.getElementById('role-' + id);
      roleEl.textContent = data.role === 'leader' ? 'Leader' : 'Follower';
      roleEl.className = 'dc-role ' + (data.role === 'leader' ? 'role-leader' : 'role-follower');
      card.className = 'drone-card' + (data.role === 'leader' ? ' leader' : '');
    }
  };
  socket.onclose = () => {
    hudStatus.textContent = 'RECONNECTING...';
    hudStatus.className = 'status-badge disconnected';
    log('⚠️ Connection lost — retrying in 3s', 'warn');
    setTimeout(connect, 3000);
  };
}

function formLabel(action) {
  const map = { START:'LAUNCHING', CIRCLE:'CIRCLE FORM', SQUARE:'SQUARE FORM', TRIANGLE:'TRIANGLE FORM', V_SHAPE:'V CHEVRON', DIAMOND:'DIAMOND FORM', LINE:'LINE FORM', SCATTER:'SCATTER', SPIRAL:'SPIRAL', SPREAD:'SPREAD OUT', TARGET:'MOVING TO TARGET', HOLD:'IDLE HOVER', LAND:'LANDING', FOLLOW:'FOLLOW MODE' };
  return map[action] || action;
}

// ─── COMMAND SEND ─────────────────────────────────────────────────────────────
const cmdInput = document.getElementById('cmd-input');
const btnSend = document.getElementById('btn-send');
const btnVoice = document.getElementById('btn-voice');

function sendCmd(text) {
  const t = (text || cmdInput.value).trim();
  if (!t) return;
  if (!socket || socket.readyState !== WebSocket.OPEN) { log('❌ Not connected', 'warn'); return; }
  socket.send(JSON.stringify({ command: t }));
  log(`📡 Sent: "${t}"`, 'cmd');
  if (!text) cmdInput.value = '';
}

btnSend.addEventListener('click', () => sendCmd());
cmdInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendCmd(); });

// ─── VOICE ────────────────────────────────────────────────────────────────────
let recActive = false;
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SR) {
  const rec = new SR();
  rec.lang = 'en-US'; rec.continuous = false; rec.interimResults = false;
  rec.onstart = () => { recActive = true; btnVoice.textContent = '🔴'; btnVoice.classList.add('recording'); log('🎙 Listening...', 'cmd'); };
  rec.onresult = ev => { const t = ev.results[0][0].transcript; cmdInput.value = t; log(`🗣 Heard: "${t}"`, 'cmd'); sendCmd(t); };
  rec.onerror = ev => { log(`⚠️ Voice error: ${ev.error}`, 'warn'); };
  rec.onend = () => { recActive = false; btnVoice.textContent = '🎙'; btnVoice.classList.remove('recording'); log('🎙 Mic closed', 'sys'); };
  btnVoice.addEventListener('click', () => { recActive ? rec.stop() : rec.start(); });
} else {
  btnVoice.addEventListener('click', () => log('❌ Speech not supported in this browser', 'warn'));
}

// ─── BOOT ─────────────────────────────────────────────────────────────────────
log('🚀 3D Engine online — connecting to Gemini AI swarm core...', 'sys');
setTimeout(connect, 400);
</script>
