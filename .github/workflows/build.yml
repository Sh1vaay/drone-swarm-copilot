name: Build, Test & Security Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  validate-swarm-core:
    name: Swarm Core (Go) Build & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          check-latest: true

      - name: Resolve Dependencies & Checksums
        working-directory: swarm-core-go
        run: |
          go mod tidy
          go mod download

      - name: Verify Code Formatting & Go Vet
        working-directory: swarm-core-go
        run: |
          go vet ./...
          test -z "$(gofmt -l .)" || (echo "Unformatted Go code found:" && gofmt -d . && exit 1)

      - name: Run Unit & Integration Tests (with Race Detector)
        working-directory: swarm-core-go
        # Scope -coverprofile to packages that have test files only.
        # Running ./... with -coverprofile causes "no such tool covdata" errors
        # for packages with no test files (cmd/swarm-server, internal/core,
        # internal/transport/grpc) because go test tries to merge profiles via
        # the covdata tool internally. Listing tested packages explicitly avoids this.
        run: |
          go test -v -race -covermode=atomic -coverprofile=coverage.out \
            ./internal/formation/... \
            ./internal/intelligence/... \
            ./internal/mission/... \
            ./internal/safety/...

      - name: Validate Binary Compilation
        working-directory: swarm-core-go
        run: CGO_ENABLED=0 go build -v -ldflags="-s -w" -o /dev/null ./cmd/swarm-server
